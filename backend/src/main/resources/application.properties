# ==============================
# = CẤU HÌNH H2 DATABASE (DEV) =
# ==============================

spring.datasource.url=jdbc:h2:mem:sanbong;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=HikariPool-1
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# H2 Console (dev only - disable in production)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==============================
# = CẤU HÌNH JPA/HIBERNATE   =
# ==============================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ==============================
# = CẤU HÌNH SERVER (PORT)    =
# ==============================
server.port=2006

# ==============================
# = CẤU HÌNH JWT (Security)   =
# ==============================
app.jwtSecret=VGhpcyBpcyBhIHNhbXBsZSBiYXNlNjQgc2VjcmV0IHRoYXQgaXMgc3VwZXIgc2VjdXJlIQ==
app.jwtIssuer=http://localhost:2006
app.jwtExpirationInMs=604800000

# ==============================
# = CẤU HÌNH LOGGING          =
# ==============================
logging.level.org.springframework.security=INFO
logging.level.com.sanbong=INFO

